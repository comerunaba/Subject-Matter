name: subject-matter-centralized

services:
  subject-matter-centralized-web:
    build: .
    container_name: subject-matter-centralized-web
    ports:
      - "4174:4173"
    environment:
      NODE_ENV: production
      PORT: 4173
      SM_SECURE_COOKIES: "false"
    volumes:
      - subject_matter_centralized_data:/app/data
    restart: unless-stopped

volumes:
  subject_matter_centralized_data:
